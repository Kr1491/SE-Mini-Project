name: Role access checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m compileall -q server.py study_platform tests
      - name: Test role and group permissions
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: node --check static/app.js
