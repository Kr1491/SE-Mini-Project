name: StudySpace checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python
        run: python -m compileall -q server.py study_platform tests
      - name: Test authorization, folders and material access
        run: python -m unittest discover -s tests -v
      - name: Test frontend behavior and contrast
        run: node --test tests/*.cjs
      - name: Check browser JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/folders.js
          node --check static/materials.js
